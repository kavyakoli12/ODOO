services:
  # ─────────────────────────────────────────────────────────────
  # SINGLE SERVICE MONOREPO — Express serves both API + React App
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: safemap-app
    runtime: node
    buildCommand: npm install && npm run build:all
    startCommand: npm run start:backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false          # Set your MongoDB Atlas URI in Render dashboard
      - key: JWT_ACCESS_SECRET
        generateValue: true  # Render auto-generates a secure random value
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
    healthCheckPath: /api/v1/health
